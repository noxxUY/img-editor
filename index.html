<!doctype html>
<html lang="en" data-palette="vc" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0919" />
    <title>noxx's IMG Editor</title>
    <meta
      name="description"
      content="noxx's IMG Editor: GTA III, Vice City and San Andreas archives edited in the browser. Browse, extract, replace, rebuild, and preview DFF models and TXD textures."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0919'/%3E%3CclipPath id='s'%3E%3Ccircle cx='16' cy='19' r='12'/%3E%3C/clipPath%3E%3Cg clip-path='url(%23s)' fill='%23ff4fa8'%3E%3Crect x='4' y='7' width='24' height='5'/%3E%3Crect x='4' y='13' width='24' height='3.5'/%3E%3Crect x='4' y='17.5' width='24' height='2.4'/%3E%3C/g%3E%3Crect x='2' y='22' width='28' height='2' fill='%233fd6f2'/%3E%3Crect x='7' y='26' width='18' height='2' fill='%233fd6f2' opacity='.55'/%3E%3C/svg%3E"
    />
    <script>
      try {
        var t = localStorage.getItem('noxx-img-theme')
        var p = localStorage.getItem('noxx-img-palette')
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.palette = p === 'sa' || p === 'iii' ? p : 'vc'
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
